name: Build SHADOW LOOP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - phase2-ads

permissions:
  contents: read

jobs:
  build:
    # ubuntu-24.04 ships Android SDK Platform 36 and Build-tools 36.x - pinned on purpose
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show branch and commit
        run: echo "branch=${{ github.ref_name }} commit=${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css game.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Configure and verify AdMob
        run: node scripts/configure-android.js
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}

      - name: Show SDK values used by the build
        run: |
          cat android/variables.gradle
          grep -n "com.android.tools.build:gradle" android/build.gradle
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-loop-debug-apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Runs AFTER the APK is uploaded on purpose: if this step goes red, you still get your APK
      # and the log tells us exactly which value is off.
      - name: Verify final Android config (target API 36)
        run: node scripts/configure-android.js --check-only
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
