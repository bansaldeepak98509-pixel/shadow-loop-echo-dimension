<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>SHADOW LOOP: ECHO DIMENSION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <button id="btnPause" class="icon" aria-label="Pause">&#10074;&#10074;</button>
      <div class="hudmid">
        <div id="lvlName">LEVEL 1</div>
        <div id="hudStats"></div>
      </div>
      <button id="btnRestart" class="icon" aria-label="Restart">&#8635;</button>
    </header>

    <div id="hint"></div>

    <main id="stage"><canvas id="game"></canvas></main>

    <section id="controls">
      <button id="btnWait" class="act">WAIT</button>
      <div id="dpad">
        <button data-a="U" class="d up" aria-label="Up">&#9650;</button>
        <button data-a="L" class="d left" aria-label="Left">&#9664;</button>
        <button data-a="R" class="d right" aria-label="Right">&#9654;</button>
        <button data-a="D" class="d down" aria-label="Down">&#9660;</button>
      </div>
      <button id="btnLoop" class="act loop">LOOP<small>record echo</small></button>
    </section>

    <div id="toast"></div>
  </div>

  <div id="overlay">
    <div id="scrTitle" class="screen">
      <h1>SHADOW LOOP</h1>
      <h2>ECHO DIMENSION</h2>
      <p class="sub" id="bestLine"></p>
      <p class="how">Walk the maze. Press <b>LOOP</b> to rewind time. Your last run becomes an <b class="echo">ECHO</b> that repeats every move, pressing switches while you run for the exit.</p>
      <button id="btnPlay" class="big">START</button>
      <button id="btnSound" class="ghost">SOUND: ON</button>
    </div>

    <div id="scrPause" class="screen">
      <h1 class="med">PAUSED</h1>
      <button id="btnResume" class="big">RESUME</button>
      <button id="btnRetry" class="ghost">RETRY ATTEMPT (KEEP ECHO)</button>
      <button id="btnRestart2" class="ghost">RESTART LEVEL</button>
      <button id="btnSound2" class="ghost">SOUND: ON</button>
      <button id="btnMenu" class="ghost">MAIN MENU</button>
    </div>

    <div id="scrComplete" class="screen">
      <h1 class="med">LEVEL COMPLETE</h1>
      <p class="sub">The Echo opened the way.</p>
      <div class="stats">
        <div><span id="cAttempts">0</span><small>ATTEMPTS</small></div>
        <div><span id="cSteps">0</span><small>STEPS</small></div>
        <div><span id="cBest">0</span><small>BEST</small></div>
      </div>
      <p class="how">More dimensions arrive in the next update.</p>
      <button id="btnReplay" class="big">REPLAY</button>
      <button id="btnMenu2" class="ghost">MAIN MENU</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
